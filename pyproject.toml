[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow5ctl"
version = "0.1.2"
description = "AI-driven aircraft design with flow5 — MCP server and CLI for low-Reynolds-number aircraft"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["aerodynamics", "aircraft-design", "flow5", "xflr5", "mcp", "uav", "glider"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
  # macOS only, deliberately. The package is pure Python and nothing in it is
  # platform-specific, but every measured claim about flow5 in docs/ was made on
  # macOS against 7.57, and this project's failure mode is confident wrong numbers.
  # Claiming a platform nobody has run would be exactly that. poc/verify_platform.py
  # turns verifying one into a single command; until someone runs it, this stays.
  "Operating System :: MacOS",
]
dependencies = [
  "mcp>=2.1.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
flow5ctl = "flow5ctl.cli:main"

[project.urls]
Homepage = "https://github.com/97kuek/flow5ctl"
Issues = "https://github.com/97kuek/flow5ctl/issues"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/flow5ctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["needs_flow5: requires a working flow5 installation"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
  # Greek letters and the degree sign are flow5's actual column names and the
  # standard notation for these quantities. Renaming alpha to `a` would make the
  # code harder to check against the solver's output, not easier.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF043"]  # regex metacharacters in pytest `match=` are intentional
# poc/ is frozen evidence, not maintained code: these scripts produced the measured
# claims in docs/ and are kept so a reader can reproduce them. Reformatting them would
# risk changing what they measured. poc/verify_platform.py is the exception — it is
# meant to be run by contributors on other platforms, so it is linted.
"poc/case_*.py" = ["ALL"]
"poc/lib/*.py" = ["ALL"]
