name: Release

# Publishing is deliberately tag-triggered rather than automatic on main: a release
# is a decision, not a side effect of merging. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  # Validate everything a release runs, without cutting a tag. The publish and
  # release jobs below are guarded to tags, so a dispatch builds and checks only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      # The tag and the packaged version must agree. Getting this wrong publishes
      # something no tag points at, and PyPI will not let the filename be reused.
      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project --with hatchling python -c \
            'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag  pyproject=$version"
          [ "$tag" = "$version" ] || { echo "::error::tag $tag does not match version $version"; exit 1; }

      - name: Install
        run: uv sync --group dev --extra plot

      - name: Lint
        run: uv run ruff check src tests tools poc

      # flow5 is not on CI runners, so the solver tests are deselected here exactly
      # as in ci.yml. A release must not be cut on a red tree.
      - name: Tests
        run: uv run pytest -q -m "not needs_flow5"

      - name: Repository checks
        run: python3 tools/check_docs.py

      - name: Build
        run: uv build

      # Catches a malformed README before PyPI rejects the upload.
      - name: Check metadata
        run: uvx twine check dist/*

      # RELEASING.md says building and importing is not the same as installing:
      # the presets are .yaml files inside the package, so one that fails to ship
      # makes the wheel useless while every test still passes, because the tests
      # read them from the source tree. Doing it by hand before the first release
      # is not protection for the ones after it.
      - name: The wheel works when installed, not just when built
        run: |
          uv venv /tmp/relcheck
          uv pip install --python /tmp/relcheck/bin/python "$(echo dist/*.whl)"
          /tmp/relcheck/bin/flow5ctl --version
          # presets are packaged data; this fails loudly if they did not ship
          /tmp/relcheck/bin/flow5ctl presets | grep -q hpa
          # and the design schema builds, which exercises the model end to end
          FLOW5CTL_WORKSPACE=/tmp/relcheck-ws \
            /tmp/relcheck/bin/flow5ctl init smoke --file examples/rc-glider.yaml
          test "$(/tmp/relcheck/bin/flow5ctl --version)" = \
               "flow5ctl $(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github_release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) as it stood at this tag."
