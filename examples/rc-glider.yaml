# A 3 m F5J-style glider. Create it with
#   flow5ctl init MyGlider --file examples/rc-glider.yaml
#
# Note the mass components: `wing_left` and `wing_right` are placed off the centreline
# on purpose. Mass that all sits at y = 0 gives Ixx = 0, and flow5 then returns `inf`
# for roll damping without complaining, so every lateral-directional result would be
# meaningless.
description: 3 m F5J-style glider
preset: rc-glider

requirements:
  cruise_speed: 12.0
  objective: min_sink
  static_margin: [0.05, 0.12]

mass:
  components:
    - {tag: fuselage,     mass: 0.40, at: [ 0.12,  0.00, 0.00]}
    - {tag: nose_ballast, mass: 0.20, at: [-0.10,  0.00, 0.00]}
    - {tag: wing_left,    mass: 0.10, at: [ 0.05, -0.75, 0.02]}
    - {tag: wing_right,   mass: 0.10, at: [ 0.05,  0.75, 0.02]}

airfoils:
  - name: AG35ish
    source: 'naca:2409'
  - name: TailFoil
    source: 'naca:0009'

wing:
  airfoil: AG35ish
  planform:
    span: 3.0
    root_chord: 0.24
    taper: 0.542
    dihedral: 3.0
    washout: -1.5
    breaks: [0.70]
  panels: {chordwise: 13, spanwise: 22}

tail:
  type: conventional
  elevator:
    position: [0.85, 0.0, 0.03]
    incidence: -1.5
    airfoil: TailFoil
    planform: {span: 0.48, root_chord: 0.13, taper: 0.69}
    panels: {chordwise: 7, spanwise: 7}
  fin:
    # Offset in z so the fin root does not sit on the elevator. Coincident surfaces
    # make flow5 compute an effective angle of attack of about -100 degrees and fail.
    position: [0.85, 0.0, 0.06]
    airfoil: TailFoil
    planform: {span: 0.26, root_chord: 0.17, taper: 0.6}
    panels: {chordwise: 7, spanwise: 5}
